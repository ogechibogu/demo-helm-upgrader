# ============================================================
# TLS 1.3 enforcement demo — K8s standard Gateway API version
# Testing whether THIS cluster's Istio/mesh implementation
# honors a TLS version floor via the standard `options` map.
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: tls13-demo
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-code
  namespace: tls13-demo
data:
  backend.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(b'{"service":"backend","message":"hello from backend"}')
    HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
  frontend.py: |
    import json, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer
    BACKEND_URL = "http://backend.tls13-demo.svc.cluster.local:8080/"
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                with urllib.request.urlopen(BACKEND_URL, timeout=5) as r:
                    backend_data = json.loads(r.read().decode())
                status = 200
            except Exception as e:
                backend_data = {"error": str(e)}
                status = 502
            self.send_response(status)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(json.dumps({"service": "frontend", "backend_response": backend_data}).encode())
    HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tls13-demo
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
      - name: backend
        image: python:3.12-slim
        command: ["python3", "/code/backend.py"]
        volumeMounts: [{name: code, mountPath: /code}]
        ports: [{containerPort: 8080}]
      volumes: [{name: code, configMap: {name: app-code}}]
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: tls13-demo}
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tls13-demo
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
      - name: frontend
        image: python:3.12-slim
        command: ["python3", "/code/frontend.py"]
        volumeMounts: [{name: code, mountPath: /code}]
        ports: [{containerPort: 8080}]
      volumes: [{name: code, configMap: {name: app-code}}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: tls13-demo}
spec:
  selector: {app: frontend}
  ports: [{port: 8080, targetPort: 8080}]
---
# --- The actual thing under test: standard K8s Gateway API resource ---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls13-test-gw
  namespace: tls13-demo
spec:
  gatewayClassName: istio
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: gw-tls-cert
      options:
        networking.istio.io/minTLSVersion: "TLSV1_3"   # <-- the thing we're testing
    allowedRoutes:
      namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: tls13-demo
spec:
  parentRefs:
  - name: tls13-test-gw
  rules:
  - backendRefs:
    - name: frontend
      port: 8080
