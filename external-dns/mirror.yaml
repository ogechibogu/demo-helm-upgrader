#!/bin/bash
# scan-check.sh — intelligent GAR vulnerability gate
#
# Usage:
#   ./scan-check.sh <image-uri> [<image-uri> ...]
#
# Exit codes:
#   0 — PASS  (no critical vulns that have a fix available)
#   1 — FAIL  (one or more CRITICAL vulns WITH a fix — pipeline blocked)
#   2 — ERROR (scan timed out or unexpected error)
#
# Env vars:
#   MAX_WAIT      seconds to wait for scan to complete (default: 300)
#   REPORT_FILE   output markdown file path (default: vuln-report-<timestamp>.md)

set -euo pipefail

if [ $# -eq 0 ]; then
  echo "Usage: $0 <image-uri> [<image-uri> ...]"
  exit 2
fi

MAX_WAIT="${MAX_WAIT:-300}"
INTERVAL=15
TIMESTAMP=$(date +%Y%m%d-%H%M%S)
REPORT_FILE="${REPORT_FILE:-vuln-report-${TIMESTAMP}.md}"
JSON_FILE="${JSON_FILE:-vuln-report-${TIMESTAMP}.json}"
JSON_IMAGES="[]"
overall_exit=0

{
  echo "# Vulnerability Scan Report"
  echo ""
  echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
  echo ""
  echo "| Result | Logic |"
  echo "|--------|-------|"
  echo "| FAIL   | CRITICAL vuln exists AND a fix is available — no excuse not to patch |"
  echo "| WARN   | CRITICAL vuln exists but no fix yet, or HIGH severity |"
  echo "| PASS   | No actionable CRITICAL findings |"
  echo ""
  echo "---"
  echo ""
} > "$REPORT_FILE"

for IMAGE_URI in "$@"; do
  echo "========================================"
  echo "Image : $IMAGE_URI"
  echo ""

  # Build GCP console URL from image URI
  GAR_HOST=$(echo "$IMAGE_URI" | cut -d'/' -f1)
  GAR_PROJECT=$(echo "$IMAGE_URI" | cut -d'/' -f2)
  GAR_REPO=$(echo "$IMAGE_URI" | cut -d'/' -f3)
  GAR_IMAGE=$(echo "$IMAGE_URI" | cut -d'/' -f4- | cut -d':' -f1)
  GAR_LOCATION=$(echo "$GAR_HOST" | sed 's/-docker\.pkg\.dev//')
  CONSOLE_URL="https://console.cloud.google.com/artifacts/docker/${GAR_PROJECT}/${GAR_LOCATION}/${GAR_REPO}/${GAR_IMAGE}?project=${GAR_PROJECT}"

  elapsed=0
  RESULT="{}"

  while true; do
    RESULT=$(gcloud artifacts docker images describe "$IMAGE_URI" \
      --show-package-vulnerability \
      --format=json 2>/dev/null || echo "{}")

    if echo "$RESULT" | jq -e 'has("package_vulnerability_summary")' &>/dev/null; then
      break
    fi

    if [ "$elapsed" -ge "$MAX_WAIT" ]; then
      echo "  ERROR: scan timed out after ${MAX_WAIT}s"
      { echo "## \`$(basename "$IMAGE_URI")\` — SCAN TIMEOUT"; echo ""; echo "---"; echo ""; } >> "$REPORT_FILE"
      overall_exit=2
      continue 2
    fi

    echo "  Scan pending... (${elapsed}s elapsed)"
    sleep "$INTERVAL"
    elapsed=$((elapsed + INTERVAL))
  done

  # Separate CRITICAL into fixable vs unfixable
  # A vuln is fixable if ANY of its packageIssues has a fixedVersion.kind != "MAXIMUM"
  CRITICAL_FIXABLE=$(echo "$RESULT" | jq '
    [.package_vulnerability_summary.vulnerabilities.CRITICAL[]?
     | select(any(.vulnerability.packageIssue[]; .fixedVersion.kind != "MAXIMUM"))]
    | length')

  CRITICAL_UNFIXABLE=$(echo "$RESULT" | jq '
    [.package_vulnerability_summary.vulnerabilities.CRITICAL[]?
     | select(all(.vulnerability.packageIssue[]; .fixedVersion.kind == "MAXIMUM"))]
    | length')

  HIGH=$(echo "$RESULT" | jq '[.package_vulnerability_summary.vulnerabilities.HIGH[]?] | length')
  HIGH_FIXABLE=$(echo "$RESULT" | jq '[.package_vulnerability_summary.vulnerabilities.HIGH[]? | select(any(.vulnerability.packageIssue[]; .fixedVersion.kind != "MAXIMUM"))] | length')
  HIGH_UNFIXABLE=$(echo "$RESULT" | jq '[.package_vulnerability_summary.vulnerabilities.HIGH[]? | select(all(.vulnerability.packageIssue[]; .fixedVersion.kind == "MAXIMUM"))] | length')

  MEDIUM=$(echo "$RESULT" | jq '[.package_vulnerability_summary.vulnerabilities.MEDIUM[]?] | length')
  MEDIUM_FIXABLE=$(echo "$RESULT" | jq '[.package_vulnerability_summary.vulnerabilities.MEDIUM[]? | select(any(.vulnerability.packageIssue[]; .fixedVersion.kind != "MAXIMUM"))] | length')
  MEDIUM_UNFIXABLE=$(echo "$RESULT" | jq '[.package_vulnerability_summary.vulnerabilities.MEDIUM[]? | select(all(.vulnerability.packageIssue[]; .fixedVersion.kind == "MAXIMUM"))] | length')

  LOW=$(echo "$RESULT" | jq '[.package_vulnerability_summary.vulnerabilities.LOW[]?] | length')
  LOW_FIXABLE=$(echo "$RESULT" | jq '[.package_vulnerability_summary.vulnerabilities.LOW[]? | select(any(.vulnerability.packageIssue[]; .fixedVersion.kind != "MAXIMUM"))] | length')
  LOW_UNFIXABLE=$(echo "$RESULT" | jq '[.package_vulnerability_summary.vulnerabilities.LOW[]? | select(all(.vulnerability.packageIssue[]; .fixedVersion.kind == "MAXIMUM"))] | length')

  if [ "$CRITICAL_FIXABLE" -gt 0 ]; then
    IMAGE_STATUS="FAIL"
    overall_exit=1
  else
    IMAGE_STATUS="PASS"
  fi

  # Console output
  echo "  Status : $IMAGE_STATUS"
  echo ""
  printf "  +------------+-------+-------------------+----------------+\n"
  printf "  | %-10s | %5s | %-17s | %-14s |\n" "Severity" "Count" "  Fix Available" "Action"
  printf "  |            |       +---------+---------+                |\n"
  printf "  |            |       | %7s | %7s |                |\n" "Yes" "No"
  printf "  +------------+-------+---------+---------+----------------+\n"
  printf "  | %-10s | %5d | %7d | %7d | %-14s |\n" \
    "CRITICAL" $((CRITICAL_FIXABLE + CRITICAL_UNFIXABLE)) $CRITICAL_FIXABLE $CRITICAL_UNFIXABLE \
    "$([ "$CRITICAL_FIXABLE" -gt 0 ] && echo "FAIL" || echo "WARN, pass")"
  printf "  | %-10s | %5d | %7d | %7d | %-14s |\n" "HIGH"   $HIGH   $HIGH_FIXABLE   $HIGH_UNFIXABLE   "WARN, pass"
  printf "  | %-10s | %5d | %7d | %7d | %-14s |\n" "MEDIUM" $MEDIUM $MEDIUM_FIXABLE $MEDIUM_UNFIXABLE "pass"
  printf "  | %-10s | %5d | %7d | %7d | %-14s |\n" "LOW"    $LOW    $LOW_FIXABLE    $LOW_UNFIXABLE    "pass"
  printf "  +------------+-------+---------+---------+----------------+\n"
  echo ""

  [ "$CRITICAL_FIXABLE" -gt 0 ]   && echo "  [FAIL] $CRITICAL_FIXABLE CRITICAL vuln(s) have patches available — pipeline blocked."
  [ "$CRITICAL_UNFIXABLE" -gt 0 ] && echo "  [WARN] $CRITICAL_UNFIXABLE CRITICAL vuln(s) present — no patch available yet, monitor closely."
  [ "$HIGH" -gt 0 ]               && echo "  [WARN] $HIGH HIGH vuln(s) detected — review and schedule remediation."
  echo ""
  echo "  GCP Console : $CONSOLE_URL"
  echo ""

  # Build JSON entry for this image
  IMAGE_JSON=$(jq -n \
    --arg uri        "$IMAGE_URI" \
    --arg url        "$CONSOLE_URL" \
    --arg status     "$IMAGE_STATUS" \
    --argjson ct     "$((CRITICAL_FIXABLE + CRITICAL_UNFIXABLE))" \
    --argjson cf     "$CRITICAL_FIXABLE" \
    --argjson cu     "$CRITICAL_UNFIXABLE" \
    --argjson ht     "$HIGH"   --argjson hf "$HIGH_FIXABLE"   --argjson hu "$HIGH_UNFIXABLE" \
    --argjson mt     "$MEDIUM" --argjson mf "$MEDIUM_FIXABLE" --argjson mu "$MEDIUM_UNFIXABLE" \
    --argjson lt     "$LOW"    --argjson lf "$LOW_FIXABLE"    --argjson lu "$LOW_UNFIXABLE" \
    '{
      uri:         $uri,
      status:      $status,
      console_url: $url,
      vulnerabilities: {
        critical: { total: $ct, fix_available: $cf, no_fix: $cu },
        high:     { total: $ht, fix_available: $hf, no_fix: $hu },
        medium:   { total: $mt, fix_available: $mf, no_fix: $mu },
        low:      { total: $lt, fix_available: $lf, no_fix: $lu }
      },
      decision: {
        action: (if $status == "FAIL" then "fail" else "pass" end),
        reason: (if $cf > 0 then "\($cf) CRITICAL vuln(s) have patches — must fix before deploy"
                 elif $cu > 0 then "\($cu) CRITICAL vuln(s) present but no fix available yet"
                 else "No actionable CRITICAL findings" end)
      }
    }')
  JSON_IMAGES=$(echo "$JSON_IMAGES" | jq --argjson img "$IMAGE_JSON" '. + [$img]')

  # Markdown report block
  {
    echo "## \`$(basename "$IMAGE_URI")\` — $IMAGE_STATUS"
    echo ""
    echo "**Full URI:** \`$IMAGE_URI\`"
    echo ""
    echo "**GCP Console:** $CONSOLE_URL"
    echo ""
    echo "| Severity | Count | Pipeline action |"
    echo "|----------|-------|-----------------|"
    echo "| CRITICAL | $((CRITICAL_FIXABLE + CRITICAL_UNFIXABLE)) | see below |"
    echo "| &nbsp;&nbsp;↳ fix available | $CRITICAL_FIXABLE | **FAIL** |"
    echo "| &nbsp;&nbsp;↳ no fix yet | $CRITICAL_UNFIXABLE | WARN, pass |"
    echo "| HIGH | $HIGH | WARN, pass |"
    echo "| MEDIUM | $MEDIUM | pass |"
    echo "| LOW | $LOW | pass |"
    echo ""

    if [ "$CRITICAL_FIXABLE" -gt 0 ]; then
      echo "### :x: CRITICAL — fix available (pipeline blocked)"
      echo ""
      echo "| CVE | Package | CVSS | Fixed version |"
      echo "|-----|---------|------|---------------|"
      echo "$RESULT" | jq -r '
        .package_vulnerability_summary.vulnerabilities.CRITICAL[]?
        | select(any(.vulnerability.packageIssue[]; .fixedVersion.kind != "MAXIMUM"))
        | .vulnerability as $v
        | $v.packageIssue[]
        | select(.fixedVersion.kind != "MAXIMUM")
        | "| \($v.shortDescription // "N/A") | \(.affectedPackage) | \($v.cvssScore // "N/A") | \(.fixedVersion.name // "N/A") |"
      '
      echo ""
    fi

    if [ "$CRITICAL_UNFIXABLE" -gt 0 ]; then
      echo "### :warning: CRITICAL — no fix available (warning only)"
      echo ""
      echo "| CVE | Package | CVSS |"
      echo "|-----|---------|------|"
      echo "$RESULT" | jq -r '
        .package_vulnerability_summary.vulnerabilities.CRITICAL[]?
        | select(all(.vulnerability.packageIssue[]; .fixedVersion.kind == "MAXIMUM"))
        | .vulnerability as $v
        | $v.packageIssue[]
        | "| \($v.shortDescription // "N/A") | \(.affectedPackage) | \($v.cvssScore // "N/A") |"
      '
      echo ""
    fi

    if [ "$HIGH" -gt 0 ]; then
      echo "### :warning: HIGH — warning only"
      echo ""
      echo "| CVE | Package | CVSS | Fix available |"
      echo "|-----|---------|------|---------------|"
      echo "$RESULT" | jq -r '
        .package_vulnerability_summary.vulnerabilities.HIGH[]?
        | .vulnerability as $v
        | $v.packageIssue[]
        | "| \($v.shortDescription // "N/A") | \(.affectedPackage) | \($v.cvssScore // "N/A") | \(if .fixedVersion.kind == "MAXIMUM" then "No" else "Yes — \(.fixedVersion.name)" end) |"
      '
      echo ""
    fi

    echo "---"
    echo ""
  } >> "$REPORT_FILE"

done

jq -n \
  --arg timestamp   "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
  --arg overall     "$([ "$overall_exit" -eq 0 ] && echo PASS || echo FAIL)" \
  --arg report      "$REPORT_FILE" \
  --argjson images  "$JSON_IMAGES" \
  '{
    timestamp:      $timestamp,
    overall_status: $overall,
    report_file:    $report,
    images:         $images
  }' > "$JSON_FILE"

echo "========================================"
echo "Report : $REPORT_FILE"
echo "JSON   : $JSON_FILE"
echo ""
if [ "$overall_exit" -eq 1 ]; then
  echo "PIPELINE STATUS: FAILED"
  echo "Reason: one or more CRITICAL vulnerabilities have patches available."
  echo "Fix the flagged packages and re-run."
elif [ "$overall_exit" -eq 0 ]; then
  echo "PIPELINE STATUS: PASSED"
fi

exit "$overall_exit"

