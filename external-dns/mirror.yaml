import argparse
import json
import os
import subprocess
import sys
import time
from datetime import datetime, timezone


def gcloud_describe(image_uri):
    r = subprocess.run(
        ['gcloud', 'artifacts', 'docker', 'images', 'describe', image_uri,
         '--show-package-vulnerability', '--format=json'],
        capture_output=True, text=True,
    )
    if r.returncode != 0:
        return None
    try:
        return json.loads(r.stdout)
    except json.JSONDecodeError:
        return None


_CLEAN_SCAN = {'package_vulnerability_summary': {'vulnerabilities': {}}}
_SCAN_TERMINAL = ('FINISHED_SUCCESS', 'FINISHED_FAILED', 'FINISHED_UNSUPPORTED')


def scan_finished(data):
    discoveries = data.get('discovery_summary', {}).get('discovery', [])
    return any(
        d.get('discovery', {}).get('analysisStatus', '') in _SCAN_TERMINAL
        for d in discoveries
    )


def poll(image_uri, max_wait, interval):
    elapsed = 0
    while True:
        data = gcloud_describe(image_uri)
        if data and 'package_vulnerability_summary' in data:
            return data
        if data and scan_finished(data):
            print("  Scan complete — no vulnerabilities found.")
            return _CLEAN_SCAN
        if elapsed >= max_wait:
            return None
        print(f"  Scan pending... ({elapsed}s elapsed)")
        time.sleep(interval)
        elapsed += interval


def fixable(vuln):
    return any(
        issue.get('fixedVersion', {}).get('kind') != 'MAXIMUM'
        for issue in vuln.get('vulnerability', {}).get('packageIssue', [])
    )


def split(vulns, severity):
    items = vulns.get(severity, [])
    yes = [v for v in items if fixable(v)]
    no  = [v for v in items if not fixable(v)]
    return items, yes, no


def console_url(image_uri):
    parts    = image_uri.split('/')
    host     = parts[0]
    project  = parts[1]
    repo     = parts[2]
    image    = '/'.join(parts[3:]).split(':')[0].split('@')[0]
    location = host.replace('-docker.pkg.dev', '')
    return (
        f"https://console.cloud.google.com/artifacts/docker/"
        f"{project}/{location}/{repo}/{image}?project={project}"
    )


def print_table(cf, cu, highs, hf, hu, meds, mf, mu, lows, lf, lu):
    print("  +------------+-------+-------------------+----------------+")
    print(f"  | {'Severity':<10} | {'Count':>5} | {'  Fix Available':<17} | {'Action':<14} |")
    print("  |            |       +---------+---------+                |")
    print(f"  |            |       | {'Yes':>7} | {'No':>7} |                |")
    print("  +------------+-------+---------+---------+----------------+")

    def row(sev, total, yes, no, action):
        print(f"  | {sev:<10} | {total:>5} | {yes:>7} | {no:>7} | {action:<14} |")

    row("CRITICAL", cf + cu,     cf,       cu,       "BLOCK" if cf > 0 else "WARN, pass")
    row("HIGH",     len(highs),  len(hf),  len(hu),  "WARN, pass")
    row("MEDIUM",   len(meds),   len(mf),  len(mu),  "pass")
    row("LOW",      len(lows),   len(lf),  len(lu),  "pass")
    print("  +------------+-------+---------+---------+----------------+")


def write_header(f):
    now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
    f.write("# Vulnerability Scan Report\n\n")
    f.write(f"Generated: {now}\n\n")
    f.write("| Result | Logic |\n")
    f.write("|--------|-------|\n")
    f.write("| FAIL   | CRITICAL vuln exists AND a fix is available — no excuse not to patch |\n")
    f.write("| WARN   | CRITICAL vuln exists but no fix yet, or HIGH severity |\n")
    f.write("| PASS   | No actionable CRITICAL findings |\n")
    f.write("\n---\n\n")


def write_image_section(f, uri, url, status, cf, cu, highs, meds, lows,
                        crit_fix, crit_nofix, high_list):
    name = uri.split('/')[-1]
    f.write(f"## `{name}` — {status}\n\n")
    f.write(f"**Full URI:** `{uri}`\n\n")
    f.write(f"**GCP Console:** {url}\n\n")
    f.write("| Severity | Count | Pipeline action |\n")
    f.write("|----------|-------|-----------------|\n")
    f.write(f"| CRITICAL | {cf + cu} | see below |\n")
    f.write(f"| &nbsp;&nbsp;↳ fix available | {cf} | **FAIL** |\n")
    f.write(f"| &nbsp;&nbsp;↳ no fix yet | {cu} | WARN, pass |\n")
    f.write(f"| HIGH | {len(highs)} | WARN, pass |\n")
    f.write(f"| MEDIUM | {len(meds)} | pass |\n")
    f.write(f"| LOW | {len(lows)} | pass |\n\n")

    if cf > 0:
        f.write("### :x: CRITICAL — fix available (pipeline blocked)\n\n")
        f.write("| CVE | Package | CVSS | Fixed version |\n")
        f.write("|-----|---------|------|---------------|\n")
        for v in crit_fix:
            vd = v['vulnerability']
            cve  = vd.get('shortDescription', 'N/A')
            cvss = vd.get('cvssScore', 'N/A')
            for issue in vd.get('packageIssue', []):
                if issue.get('fixedVersion', {}).get('kind') != 'MAXIMUM':
                    pkg   = issue.get('affectedPackage', 'N/A')
                    fixed = issue.get('fixedVersion', {}).get('name', 'N/A')
                    f.write(f"| {cve} | {pkg} | {cvss} | {fixed} |\n")
        f.write("\n")

    if cu > 0:
        f.write("### :warning: CRITICAL — no fix available (warning only)\n\n")
        f.write("| CVE | Package | CVSS |\n")
        f.write("|-----|---------|------|\n")
        for v in crit_nofix:
            vd = v['vulnerability']
            cve  = vd.get('shortDescription', 'N/A')
            cvss = vd.get('cvssScore', 'N/A')
            for issue in vd.get('packageIssue', []):
                pkg = issue.get('affectedPackage', 'N/A')
                f.write(f"| {cve} | {pkg} | {cvss} |\n")
        f.write("\n")

    if highs:
        f.write("### :warning: HIGH — warning only\n\n")
        f.write("| CVE | Package | CVSS | Fix available |\n")
        f.write("|-----|---------|------|---------------|\n")
        for v in high_list:
            vd = v['vulnerability']
            cve  = vd.get('shortDescription', 'N/A')
            cvss = vd.get('cvssScore', 'N/A')
            for issue in vd.get('packageIssue', []):
                pkg = issue.get('affectedPackage', 'N/A')
                fix_str = (
                    f"Yes — {issue.get('fixedVersion', {}).get('name', 'N/A')}"
                    if issue.get('fixedVersion', {}).get('kind') != 'MAXIMUM'
                    else "No"
                )
                f.write(f"| {cve} | {pkg} | {cvss} | {fix_str} |\n")
        f.write("\n")

    f.write("---\n\n")


def main():
    parser = argparse.ArgumentParser(
        description='GAR vulnerability gate — Binary Authorization signing decision'
    )
    parser.add_argument('images', nargs='+', metavar='image-uri',
                        help='full GAR image URI(s) to scan')
    parser.add_argument('--timeout', type=int,
                        default=int(os.environ.get('MAX_WAIT', '300')),
                        metavar='SECONDS',
                        help='how long to wait for scan results (default: 300)')
    args = parser.parse_args()

    max_wait    = args.timeout
    interval    = 15
    ts          = datetime.now().strftime('%Y%m%d-%H%M%S')
    report_file = os.environ.get('REPORT_FILE', f'vuln-report-{ts}.md')
    json_file   = os.environ.get('JSON_FILE',   f'vuln-report-{ts}.json')
    sign_file   = os.environ.get('SIGN_FILE',   '/tmp/binauth_sign')

    overall_fail = False
    json_images  = []

    with open(report_file, 'w') as rf:
        write_header(rf)

        for uri in args.images:
            print("========================================")
            print(f"Image : {uri}")
            print()

            url  = console_url(uri)
            data = poll(uri, max_wait, interval)

            if data is None:
                print(f"  ERROR: scan timed out after {max_wait}s")
                rf.write(f"## `{uri.split('/')[-1]}` — SCAN TIMEOUT\n\n---\n\n")
                sys.exit(2)

            vulns = data.get('package_vulnerability_summary', {}).get('vulnerabilities', {})

            _, crit_fix, crit_nofix = split(vulns, 'CRITICAL')
            highs, high_fix, high_nofix = split(vulns, 'HIGH')
            meds,  med_fix,  med_nofix  = split(vulns, 'MEDIUM')
            lows,  low_fix,  low_nofix  = split(vulns, 'LOW')

            cf = len(crit_fix)
            cu = len(crit_nofix)

            if cf > 0:
                status     = "FAIL"
                image_sign = False
                overall_fail = True
            else:
                status     = "PASS"
                image_sign = True

            with open(sign_file, 'w') as sf:
                sf.write('true' if image_sign else 'false')

            print(f"  Status : {status}")
            print()
            print_table(cf, cu, highs, high_fix, high_nofix,
                        meds, med_fix, med_nofix,
                        lows, low_fix, low_nofix)
            print()

            if cf > 0:
                print(f"  [BLOCK] {cf} CRITICAL vuln(s) have patches available — Binary Authorization will NOT sign this image.")
            if cu > 0:
                print(f"  [WARN]  {cu} CRITICAL vuln(s) present — no patch available yet, monitor closely.")
            if highs:
                print(f"  [WARN]  {len(highs)} HIGH vuln(s) detected — review and schedule remediation.")
            print()
            print(f"  GCP Console : {url}")
            print(f"  binauth_sign : {'true' if image_sign else 'false'}")
            print()

            json_images.append({
                'uri':          uri,
                'status':       status,
                'binauth_sign': image_sign,
                'console_url':  url,
                'vulnerabilities': {
                    'critical': {'total': cf + cu,      'fix_available': cf,          'no_fix': cu},
                    'high':     {'total': len(highs),   'fix_available': len(high_fix), 'no_fix': len(high_nofix)},
                    'medium':   {'total': len(meds),    'fix_available': len(med_fix),  'no_fix': len(med_nofix)},
                    'low':      {'total': len(lows),    'fix_available': len(low_fix),  'no_fix': len(low_nofix)},
                },
                'decision': {
                    'binauth_sign': image_sign,
                    'reason': (
                        f"{cf} CRITICAL vuln(s) have patches — Binary Authorization will not sign" if cf > 0
                        else f"{cu} CRITICAL vuln(s) present but no fix available yet"             if cu > 0
                        else "No actionable CRITICAL findings"
                    ),
                },
            })

            write_image_section(
                rf, uri, url, status,
                cf, cu, highs, meds, lows,
                crit_fix, crit_nofix, highs,
            )

    now_iso = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

    with open(json_file, 'w') as jf:
        json.dump({
            'timestamp':      now_iso,
            'overall_status': 'FAIL' if overall_fail else 'PASS',
            'report_file':    report_file,
            'images':         json_images,
        }, jf, indent=2)

    print("========================================")
    print(f"Report : {report_file}")
    print(f"JSON   : {json_file}")

    sys.exit(0)


if __name__ == '__main__':
    main()
