
name: Build, Scan and Sign

on:
  push:
    branches: [main]

env:
  GAR_LOCATION: us-central1
  GAR_PROJECT: my-gcp-project
  GAR_REPO: my-repo
  BINAUTH_ATTESTOR: my-attestor
  KMS_KEY_VERSION: projects/my-gcp-project/locations/us-central1/keyRings/my-keyring/cryptoKeys/my-key/cryptoKeyVersions/1

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to GAR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push images
        run: |
          IMAGE_BASE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT }}/${{ env.GAR_REPO }}"

          docker build -t "$IMAGE_BASE/api:${{ github.sha }}"      ./api
          docker build -t "$IMAGE_BASE/worker:${{ github.sha }}"   ./worker

          docker push "$IMAGE_BASE/api:${{ github.sha }}"
          docker push "$IMAGE_BASE/worker:${{ github.sha }}"

          # Write the list of pushed images for the scan step
          echo "IMAGE_URIS=$IMAGE_BASE/api:${{ github.sha }} $IMAGE_BASE/worker:${{ github.sha }}" >> $GITHUB_ENV

      - name: Scan and sign images
        run: |
          for IMAGE_URI in $IMAGE_URIS; do
            echo "============================================================"
            echo "Processing: $IMAGE_URI"
            echo "============================================================"

            python3 scan-check.py "$IMAGE_URI"

            sign=$(cat /tmp/binauth_sign)

            if [ "$sign" = "true" ]; then
              echo "Signing $IMAGE_URI..."
              gcloud beta container binauthz attestations sign-and-create \
                --artifact-url="$IMAGE_URI" \
                --attestor="${{ env.BINAUTH_ATTESTOR }}" \
                --attestor-project="${{ env.GAR_PROJECT }}" \
                --keyversion="${{ env.KMS_KEY_VERSION }}"
              echo "Signed: $IMAGE_URI"
            else
              echo "SKIP: $IMAGE_URI has actionable CRITICAL vulnerabilities — Binary Authorization will not sign."
            fi
          done
